name: Whisketch
options:
  deploymentTarget:
    iOS: '18.0'
targets:
  Whisketch:
    type: application
    platform: iOS
    sources:
      - path: Native
        excludes: [Resources]
      - path: Native/Resources/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catlyte.Whisketch
        PRODUCT_NAME: Whisketch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Whisketch
        INFOPLIST_KEY_NSCameraUsageDescription: Capture whiteboards and notes you choose to import into Whisketch.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos to add to your notebooks.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save drawings you choose to export to your photo library.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: 0.5.2
        CURRENT_PROJECT_VERSION: 10
        DEVELOPMENT_TEAM: 6PGL458FD6
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
  WhisketchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/NativeUI]
    dependencies:
      - target: Whisketch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catlyte.Whisketch.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Whisketch
        SWIFT_VERSION: '5.0'
schemes:
  WhisketchSmoke:
    build:
      targets:
        Whisketch: all
        WhisketchUITests: [test]
    test:
      targets: [WhisketchUITests]
